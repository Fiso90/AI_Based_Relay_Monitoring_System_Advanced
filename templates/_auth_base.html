<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Sign in{% endblock %} — AI Relay Monitor</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="auth-body">
<div class="auth-card card">
  <div class="brand" style="padding-bottom:14px">
    <div class="brand-mark">AI</div>
    <div class="brand-text">
      <div class="brand-title">Relay Monitor</div>
      <div class="brand-sub">3 MW alternator &middot; AI decision support</div>
    </div>
  </div>
  {% block body %}{% endblock %}
</div>
</body>
</html>
