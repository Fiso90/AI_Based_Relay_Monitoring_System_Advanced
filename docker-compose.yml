services:
  dashboard:
    build: .
    container_name: ai_relay_monitor_system
    ports:
      - "5000:5000"
    volumes:
      # Mount models/ so trained artifacts persist across container restarts
      - ./models:/app/models
      # Mount data/ so you can swap in a new dataset without rebuilding the image
      - ./data:/app/data
    environment:
      - FLASK_DEBUG=0
      # Optional: fixed session-signing key (otherwise generated once into data/.secret_key)
      # - SECRET_KEY=change-me
      # Set to 1 when served over HTTPS so the session cookie is Secure-only
      # - COOKIE_SECURE=1
    restart: unless-stopped
